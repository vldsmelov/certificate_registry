services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DEV_BOOTSTRAP: ${DEV_BOOTSTRAP}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CREATOR_EMAIL: ${CREATOR_EMAIL}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD}
      SIGNER_EMAIL: ${SIGNER_EMAIL}
      SIGNER_PASSWORD: ${SIGNER_PASSWORD}
      TEMPLATE_STORAGE_DIR: ${TEMPLATE_STORAGE_DIR:-/app/data/templates}
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-http://localhost:3000}
      PDF_FONT_PATH: ${PDF_FONT_PATH:-/app/assets/fonts/DejaVuSans.ttf}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

  seed:
    profiles: ["seed"]
    build:
      context: ./backend
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DEV_BOOTSTRAP: ${DEV_BOOTSTRAP}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CREATOR_EMAIL: ${CREATOR_EMAIL}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD}
      SIGNER_EMAIL: ${SIGNER_EMAIL}
      SIGNER_PASSWORD: ${SIGNER_PASSWORD}
      TEMPLATE_STORAGE_DIR: ${TEMPLATE_STORAGE_DIR:-/app/data/templates}
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-http://localhost:3000}
      PDF_FONT_PATH: ${PDF_FONT_PATH:-/app/assets/fonts/DejaVuSans.ttf}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node -e \"console.log('Running seed...')\" && npx ts-node prisma/seed.ts"]

volumes:
  db_data:
  backend_data:
