services:
  db:
    image: postgres:15
    container_name: cert-registry-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificate_registry
    ports:
      - "5432:5432"
    volumes:
      - cert_registry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "psql -h db -U postgres -d certificate_registry -v ON_ERROR_STOP=1 -f /migrations/0001_init.sql"
    environment:
      PGPASSWORD: postgres

  web:
    working_dir: /app
    image: node:20-alpine
    command: [
      "sh",
      "-c",
      "npm install && npm --workspace apps/web run dev -- --hostname=0.0.0.0",
    ]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/certificate_registry
      - TEMPLATE_STORAGE_DIR=./template-assets
      - PUBLIC_PDF_DOWNLOAD=false
      - ENABLE_XLSX_EXPORT=true
      - ENABLE_EMAILS=false
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  cert_registry_db_data:
